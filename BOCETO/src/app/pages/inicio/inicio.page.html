<ion-content [fullscreen]="true">
  
  <div class="main-container animated-bg">
    
    <div class="center-content">

      <div class="logo-container">
        <img src="assets/icon/nuevo-logo-flecha.png" alt="Logo En Ruta" class="img-logo">
      </div>

      <h1 class="app-title">EN RUTA APP</h1>
      <p class="app-subtitle">Tu envío, seguro y a tiempo.</p>

      <div class="action-area">

        <!-- ✅ CAMBIADO A /login -->
        <ion-button expand="block" class="login-btn" routerLink="/login">
          INICIAR SESIÓN
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
        
        <!-- ✅ AHORA NAVEGA A registro-usuario -->
        <p class="register-link">
          ¿No tienes cuenta? 
          <strong routerLink="/registro-usuario" style="cursor:pointer;">
            Regístrate aquí
          </strong>
        </p>

      </div>

    </div>

  </div>

</ion-content>
